name: floodwatch-ongkharak

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_BASE_URL: /api
      VITE_API_PROXY_TARGET: http://api:8080
      VITE_USE_POLLING: "true"
    volumes:
      - ./apps/web/src:/app/apps/web/src:ro
      - ./apps/web/public:/app/apps/web/public:ro
      - ./apps/web/index.html:/app/apps/web/index.html:ro
      - ./apps/web/vite.config.ts:/app/apps/web/vite.config.ts:ro
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: apps/backend
      target: api
    environment: &backend-environment
      APP_ENV: ${APP_ENV:-development}
      API_PORT: "8080"
      DATABASE_URL: ${DATABASE_URL:-postgres://floodwatch:local-only-change-me@postgres:5432/floodwatch?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-local-minio-user}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-local-only-change-me}
      MINIO_BUCKET: ${MINIO_BUCKET:-floodwatch-dev}
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-to-a-long-random-value-before-exposing-service}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-}
      COOKIE_NAME: ${COOKIE_NAME:-fw_refresh}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-Lax}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URL: ${GOOGLE_OAUTH_REDIRECT_URL:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:5173}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      WEATHER_ENABLED: ${WEATHER_ENABLED:-}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-python:8001}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBSCRIBER: ${VAPID_SUBSCRIBER:-}
      INGESTION_FIXTURE_URL: ${INGESTION_FIXTURE_URL:-}
      INGESTION_FIXTURE_SOURCE_CODE: ${INGESTION_FIXTURE_SOURCE_CODE:-}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 15s

  worker:
    build:
      context: apps/backend
      target: worker
    environment: *backend-environment
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  admin-bootstrap:
    profiles: ["tools"]
    build:
      context: apps/backend
      target: admin-bootstrap
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy

  go-test:
    profiles: ["tools"]
    build:
      context: apps/backend
      target: build
    volumes:
      - ./docs/api:/docs/api:ro
    environment:
      TEST_DATABASE_URL: ${DATABASE_URL:-postgres://floodwatch:local-only-change-me@postgres:5432/floodwatch?sslmode=disable}
    command: ["go", "test", "-v", "./..."]
    depends_on:
      postgres:
        condition: service_healthy

  ai-python:
    build:
      context: apps/ai-python
    environment:
      AI_PORT: "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgis/postgis:16-3.4
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-floodwatch}
      POSTGRES_USER: ${POSTGRES_USER:-floodwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 3s
      retries: 5

  migrate:
    image: migrate/migrate:v4.18.3
    profiles: ["tools"]
    volumes:
      - ./apps/backend/migrations:/migrations:ro
    entrypoint: ["migrate"]
    command:
      - -path=/migrations
      - -database=${DATABASE_URL:-postgres://floodwatch:local-only-change-me@postgres:5432/floodwatch?sslmode=disable}
      - up
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-local-minio-user}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-local-only-change-me}
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5

  caddy:
    image: caddy:2.10-alpine
    ports:
      - "${CADDY_BIND_ADDRESS:-0.0.0.0}:${CADDY_HTTP_PORT:-80}:80"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
