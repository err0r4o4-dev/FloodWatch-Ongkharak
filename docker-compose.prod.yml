version: '3.8'

services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - ./apps/web/dist:/srv/web
    depends_on:
      - api

  api:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: backend-api-prod
    restart: always
    environment:
      - APP_ENV=production
      - API_PORT=8080
      - WEATHER_ENABLED=${WEATHER_ENABLED:-false}
      - DATABASE_URL=postgres://floodwatch:${DB_PASSWORD}@postgres:5432/floodwatch
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=floodwatch-media
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - JWT_ISSUER=${JWT_ISSUER:-}
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_NAME=fw_refresh
      - COOKIE_SECURE=true
      - COOKIE_SAMESITE=Lax
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
      - GOOGLE_OAUTH_REDIRECT_URL=${GOOGLE_OAUTH_REDIRECT_URL:-}
      - AI_SERVICE_URL=http://ai-service:8000
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_REQUIRE_TLS=${SMTP_REQUIRE_TLS:-true}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBSCRIBER=${VAPID_SUBSCRIBER}
    depends_on:
      - postgres
      - redis
      - minio

  worker:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.worker
    container_name: backend-worker-prod
    restart: always
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgres://floodwatch:${DB_PASSWORD}@postgres:5432/floodwatch
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=floodwatch-media
      - AI_SERVICE_URL=http://ai-service:8000
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBSCRIBER=${VAPID_SUBSCRIBER}
    depends_on:
      - postgres
      - redis
      - minio

  ai-service:
    build:
      context: ./apps/ai-python
    container_name: ai-service-prod
    restart: always
    environment:
      - APP_ENV=production

  postgres:
    image: postgis/postgis:16-3.4
    container_name: postgres-prod
    restart: always
    environment:
      - POSTGRES_USER=floodwatch
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=floodwatch
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Exposing ports removed for production isolation

  redis:
    image: redis:7-alpine
    container_name: redis-prod
    restart: always
    volumes:
      - redis_data:/data
    # Exposing ports removed for production isolation

  minio:
    image: minio/minio:RELEASE.2024-01-28T22-35-53Z
    container_name: minio-prod
    restart: always
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    # Exposing ports removed for production isolation

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
