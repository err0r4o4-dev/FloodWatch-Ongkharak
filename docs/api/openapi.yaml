      operationId: uploadReportImage
      security: []
      parameters:
        - { $ref: '#/components/parameters/ResourceID' }
        - name: X-Report-Upload-Token
          in: header
          required: true
          schema: { type: string }
          description: Expiring capability from the create response. Kept in memory, never in URLs. Server checks its hash, report scope, expiry and PENDING state.
      requestBody:
        required: true
