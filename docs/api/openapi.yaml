      operationId: listPublicAlerts
      description: No alerts does not mean safe. Alert severity is a rule decision, not current resource status; clients must refetch canonical evidence.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 1000, default: 0 } }
      responses:
        '200':
