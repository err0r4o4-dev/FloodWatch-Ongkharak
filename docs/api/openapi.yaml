          - INFO
          - WATCH
          - WARNING
          - CRITICAL
        sourceType:
          $ref: '#/components/schemas/SourceType'
        createdAt:
          type: string
          format: date-time
        readAt:
          type:
          - string
          - 'null'
          format: date-time
    AlertRuleList:
      type: object
