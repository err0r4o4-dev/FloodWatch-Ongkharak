      operationId: createReport
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GuestReportInput' } } }
      responses:
        '201':
          description: Guest submission is PENDING and COMMUNITY. A short-lived report-scoped upload token is returned once; it does not permit reading unpublished data or editing text. Rate-limited per trusted client address.
          content: { application/json: { schema: { $ref: '#/components/schemas/GuestReportResponse' } } }
        default: { $ref: '#/components/responses/DomainError' }
