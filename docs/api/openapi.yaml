          - string
          - number
          - boolean
          - json
        description:
          type: string
        category:
          type: string
          enum:
          - rate_limit
          - alert
          - ingestion
          - feature
          - security
        editable:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type:
          - string
          - 'null'
          format: uuid
    AdminRoleInput:
      type: object
