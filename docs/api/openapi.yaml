openapi: 3.1.0
info:
  title: Flood Watch Ongkharak API
  version: 0.5.0
  description: |
    # Introduction
    Public REST API for Flood Watch Ongkharak. The Go API is the public backend.

    # Evidence and freshness
    Keep OFFICIAL, COMMUNITY, and AI provenance distinct.
    Availability data that is stale or unavailable is UNKNOWN, never SAFE.

    # Authentication
    Access tokens use JWT bearer authentication.
    Refresh tokens are sent only in an HttpOnly cookie. The cookie uses the configured
    SameSite Lax or Strict policy and Secure is enabled in production; refresh tokens
    are never returned in response bodies. Phase 2 flood-domain collections are empty
    until explicitly populated; no response implies current safe conditions. GUEST has
    no persisted role; only USER and ADMIN accounts exist. Authentication is required
    for the Phase 1 demonstration routes.

    # Community reports
    Phase 6 community reports are always COMMUNITY evidence. Only VERIFIED reports
    and their images are public; an empty list never means SAFE. Submission time is
    not a measured observation time. Pending reports are owner-editable, rejected
    and verified reports are immutable, and an ADMIN cannot verify their own report.

    # Alerts and realtime
    Phase 7 alerts are created only by explicit structured rules; no threshold is
    preconfigured. Public SSE transports versioned change notifications, not canonical
    resource state. Redis outages do not roll back committed PostgreSQL data.

    # Errors
    Other auth failures use the ErrorResponse envelope (including 403 origin rejection,
    415 unsupported media type, 429 rate limiting, and 500 infrastructure failure).
servers:
  - url: /
    description: Public API through Caddy or Go directly; resource paths include /api where required
tags:
  - name: Notifications
    description: Account-scoped inbox and independent browser Push subscriptions.
  - name: System
    description: Service liveness and dependency readiness.
  - name: Auth
    description: Account authentication and session lifecycle.
  - name: Overview
    description: Aggregated flood situation overview.
  - name: Alerts
    description: Structured alerts and their evidence.
  - name: Water
    description: Water stations and timestamped readings.
  - name: Flood
    description: Flood situation information.
  - name: Map
    description: Geospatial flood situation information.
  - name: Roads
    description: Roads and condition history; not a travel-safety guarantee.
  - name: CCTV
    description: Camera information and evidence.
  - name: Reports
    description: Community reports and public verified evidence.
  - name: Realtime
    description: Versioned server-sent change notifications.
  - name: Admin
    description: ADMIN-only management and moderation.
  - name: Data Sources
    description: Data provider metadata and provenance.
  - name: Flood Domain
    description: Flood events and assessed risk areas.
paths:
  /health:
    get:
      tags: [System]
      summary: Report API process liveness
      operationId: getHealth
      responses:
        '200':
          description: The API process is accepting requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /ready:
    get:
      tags: [System]
      summary: Report API dependency readiness
      operationId: getReadiness
      responses:
        '200':
          description: PostgreSQL, Redis, and MinIO liveness checks pass.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: At least one required dependency is unavailable or not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /api/v1/auth/google/config:
    get:
      tags: [Auth]
      summary: Read optional Google login availability
      operationId: getGoogleLoginConfig
      security: []
      responses:
        '200':
          description: Availability only; no client configuration or secrets.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [enabled]
                properties:
                  enabled: {type: boolean}
  /api/v1/auth/google/start:
    get:
      tags: [Auth]
      summary: Start browser-bound Google authorization
      operationId: startGoogleLogin
      security: []
      parameters:
        - in: query
          name: returnTo
          schema: {type: string, maxLength: 2048, default: /reports}
          description: Internal application destination only; external, encoded ambiguous and authentication-loop paths are rejected.
      responses:
        '302':
          description: Redirect to Google with state, nonce and S256 PKCE; sets a five-minute host-only HttpOnly SameSite=Lax transaction cookie, Secure in production.
          headers:
            Location: {schema: {type: string}}
            Set-Cookie: {schema: {type: string}}
        '400':
          description: Invalid internal destination or duplicate query input.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '403':
          description: Browser origin or fetch site rejected.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '429':
          description: Start rate limit exceeded.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '500':
          description: Challenge persistence failure.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '503':
          description: Google login is not configured.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /api/v1/auth/google/callback:
    get:
      tags: [Auth]
      summary: Consume Google authorization callback
      operationId: completeGoogleLogin
      description: Requires matching browser transaction cookie and single-use state. Verifies Google's signed ID token before creating accounts or sessions. Email collisions redirect to password verification without issuing a session. Do not log callback query strings.
      security: []
      parameters:
        - {in: query, name: state, required: true, schema: {type: string, maxLength: 43}}
        - {in: query, name: code, schema: {type: string, maxLength: 4096}}
        - {in: query, name: error, schema: {type: string}}
      responses:
        '302':
          description: Fixed-origin redirect to completion, pending link, or login with a safe error code. Clears OAuth cookie; success sets the regular refresh cookie. Tokens are never placed in the redirect URL. No-store/no-referrer apply.
          headers:
            Location: {schema: {type: string}}
            Set-Cookie: {schema: {type: string}}
        '429':
          description: Callback rate limit exceeded; no state or identity is accepted.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '503':
          description: Google login is not configured.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /api/v1/auth/google/link:
    post:
      tags: [Auth]
      summary: Verify an existing password before linking Google
      operationId: linkGoogleIdentity
      description: Requires a five-minute pending-link HttpOnly cookie from a verified Google callback and an approved browser Origin. Account and subject come from server-side state, never submitted IDs or email. Maximum five failed password attempts per pending link. This endpoint does not use bearer authentication.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: {type: string, format: password, maxLength: 128, writeOnly: true}
      responses:
        '200':
          description: Identity linked, pending cookie cleared and ordinary refresh cookie set; browser navigates to completion and bootstraps refresh/me.
          headers:
            Set-Cookie: {schema: {type: string}}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [returnTo]
                properties:
                  returnTo: {type: string, maxLength: 2048}
        '400':
          description: Invalid or unknown JSON fields.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '401':
          description: Generic wrong password, invalid/expired/consumed pending state, or unavailable account.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '403':
          description: Origin rejected.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '409':
          description: Identity already belongs to another account or the account has a different Google identity.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '415':
          description: Expected application/json.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '429':
          description: Password attempt or endpoint rate limit exceeded.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '500':
          description: Identity or session persistence failure.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '503':
          description: Google login is not configured.
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Public registration is disabled in the Guest flow
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '403':
          description: REGISTRATION_DISABLED. Existing users are retained; visitors submit as Guest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Start an authenticated session using email or username
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
      responses:
        '200':
          description: A session was created. The refresh token is sent only in the HttpOnly cookie.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshTokenCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          description: Invalid credentials. This response is intentionally generic for unknown, disabled, and incorrect-password accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/password/request-otp:
    post:
      tags: [Auth]
      summary: Request an account-neutral password recovery email
      operationId: requestPasswordOTP
      description: Sends a six-digit code to a valid supplied email without disclosing account eligibility. Unknown, disabled, and Google-only accounts cannot obtain a reset grant. Requires configured SMTP; never returns the OTP. A new accepted request invalidates the previous challenge and grant. Limited to one request per email per 60 seconds and five per hour, plus the direct-peer limit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestPasswordOTP'
      responses:
        '202':
          description: SMTP accepted the account-neutral email; this does not prove inbox delivery or that an eligible account exists. Response is not cacheable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordOTPChallenge'
        '400':
          description: Invalid email or JSON body (INVALID_REQUEST).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Unapproved request origin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Email cooldown/hour cap (RECOVERY_RATE_LIMITED) or direct-peer cap (RATE_LIMITED). Retry later; Retry-After does not guarantee eligibility when the hourly cap remains exhausted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: SMTP is disabled or delivery failed (RECOVERY_UNAVAILABLE). No fake success is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal recovery failure without diagnostic details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/password/verify-otp:
    post:
      tags: [Auth]
      summary: Exchange a valid OTP for a restricted single-use reset grant
      operationId: verifyPasswordOTP
      description: Challenges expire after ten minutes and allow at most five well-formed failed attempts. Verification is single-use and does not create a login session. Keep the returned grant only in memory, not in URLs or persistent storage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyPasswordOTP'
      responses:
        '200':
          description: A five-minute, password-reset-only grant was created. Response is not cacheable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetGrant'
        '400':
          description: Malformed JSON (INVALID_REQUEST) or wrong, expired, exhausted, replayed, or ineligible OTP (INVALID_OTP).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Unapproved request origin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Direct-peer verification rate limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Recovery service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal recovery failure without diagnostic details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/password/reset:
    post:
      tags: [Auth]
      summary: Set a new password using a restricted reset grant
      operationId: resetPassword
      description: Atomically consumes the grant, updates the Argon2id hash, revokes all refresh sessions, and increments the account authentication version so old access tokens fail. Does not log the user in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Password changed and the browser's old refresh cookie cleared. No response body; not cacheable.
        '400':
          description: Invalid password/body (INVALID_REQUEST) or missing, malformed, expired, replayed, superseded, or ineligible grant (INVALID_RESET_TOKEN).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Unapproved request origin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Direct-peer reset rate limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Recovery service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal recovery failure without diagnostic details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate the refresh session
      operationId: refresh
      parameters:
        - $ref: '#/components/parameters/RefreshTokenCookie'
      responses:
        '200':
          description: The refresh token was rotated and the replacement is sent only in the HttpOnly cookie.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshTokenCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          description: The refresh token is missing, invalid, expired, revoked, or has already been used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: End the current refresh session
      operationId: logout
      parameters:
        - $ref: '#/components/parameters/OptionalRefreshTokenCookie'
      responses:
        '204':
          description: The session is revoked when present and the refresh cookie is cleared. This operation is idempotent and has no response body.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearedRefreshTokenCookie'
  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Get the current user
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Authentication is required or the bearer token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags: [Auth]
      summary: Update the current user's username
      operationId: updateCurrentUsername
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username]
              properties:
                username:
                  type: string
                  pattern: '^\s*[A-Za-z0-9_]{3,32}\s*$'
                  description: Leading and trailing whitespace is trimmed before validation; the normalized username is lowercase, 3-32 ASCII letters, digits, or underscores and globally unique.
      responses:
        '200':
          description: The authenticated user after the username update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid username or JSON body, including unknown fields (INVALID_REQUEST).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication is required, the bearer token is invalid, or the account is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The normalized username is already registered (USERNAME_EXISTS).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Expected application/json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Username persistence failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/user/ping:
    get:
      tags: [Auth]
      summary: Verify user authentication
      operationId: pingUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Bearer authentication succeeded. This response has no body.
        '401':
          description: Authentication is required or the bearer token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/admin/ping:
    get:
      tags: [Admin]
      summary: Verify administrator authorization
      operationId: pingAdmin
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Bearer authentication and administrator authorization succeeded. This response has no body.
        '401':
          description: Authentication is required or the bearer token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The authenticated user does not have the ADMIN role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/data-sources:
    get:
      tags: [Data Sources]
      summary: List provenance sources without authentication
      operationId: listDataSources
      parameters: [{ $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Offset' }]
      responses:
        '200':
          description: Sources, including their immutable provenance classification.
          content: { application/json: { schema: { $ref: '#/components/schemas/DataSourceList' } } }
        default: { $ref: '#/components/responses/DomainError' }
    post:
      tags: [Data Sources]
      summary: Create a source with explicit provenance classification
      operationId: createDataSource
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateDataSource' } } }
      responses:
        '201':
          description: Source created. Never send credentials or secrets.
          content: { application/json: { schema: { type: object, required: [dataSource], properties: { dataSource: { $ref: '#/components/schemas/DataSource' } } } } }
        default: { $ref: '#/components/responses/DomainError' }
  /api/v1/water-stations:
    get:
      tags: [Water]
      summary: List stations; optional WGS84 bounding box
      operationId: listWaterStations
      parameters: [{ $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Offset' }, { $ref: '#/components/parameters/BBox' }]
      responses:
        '200':
          description: Stations with GeoJSON Point coordinates ordered longitude, latitude.
          content: { application/json: { schema: { $ref: '#/components/schemas/StationList' } } }
        default: { $ref: '#/components/responses/DomainError' }
  /api/v1/water-stations/{id}:
    get:
      tags: [Water]
      summary: Get a station
      operationId: getWaterStation
      parameters: [{ $ref: '#/components/parameters/ResourceID' }]
      responses:
        '200':
          description: Station found.
          content: { application/json: { schema: { type: object, required: [station], properties: { station: { $ref: '#/components/schemas/WaterStation' } } } } }
        default: { $ref: '#/components/responses/DomainError' }
  /api/v1/water-stations/{id}/readings:
    get:
      tags: [Water]
      summary: List time-series observations for a station
      operationId: listWaterReadings
      parameters: [{ $ref: '#/components/parameters/ResourceID' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Offset' }, { $ref: '#/components/parameters/From' }, { $ref: '#/components/parameters/To' }]
      responses:
        '200':
          description: Descending observed time; waterLevelM is meters and nullable, never guessed.
          content: { application/json: { schema: { $ref: '#/components/schemas/ReadingList' } } }
        default: { $ref: '#/components/responses/DomainError' }
  /api/v1/flood-events:
    get:
      tags: [Flood Domain]
      summary: List source-aware flood events
      operationId: listFloodEvents
      parameters: [{ $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Offset' }, { $ref: '#/components/parameters/BBox' }, { $ref: '#/components/parameters/EventStatusFilter' }, { $ref: '#/components/parameters/SeverityFilter' }]
      responses:
        '200':
          description: Raw and effective statuses are separate; stale evidence has UNKNOWN effective status.
          content: { application/json: { schema: { $ref: '#/components/schemas/EventList' } } }
        default: { $ref: '#/components/responses/DomainError' }
  /api/v1/flood-events/{id}:
    get:
      tags: [Flood Domain]
      summary: Get a flood event
      operationId: getFloodEvent
      parameters: [{ $ref: '#/components/parameters/ResourceID' }]
      responses:
        '200':
          description: Flood event found.
          content: { application/json: { schema: { type: object, required: [event], properties: { event: { $ref: '#/components/schemas/FloodEvent' } } } } }
        default: { $ref: '#/components/responses/DomainError' }
  /api/v1/risk-areas:
    get:
      tags: [Flood Domain]
      summary: List spatial risk areas
      operationId: listRiskAreas
      parameters: [{ $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Offset' }, { $ref: '#/components/parameters/BBox' }]
      responses:
        '200':
          description: Undated or expired assessment has UNKNOWN effective risk.
          content: { application/json: { schema: { $ref: '#/components/schemas/RiskList' } } }
        default: { $ref: '#/components/responses/DomainError' }
    post:
      tags: [Flood Domain]
      summary: Create a manually assessed risk area
      operationId: createRiskArea
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateRiskArea' } } }
      responses:
        '201':
          description: Valid WGS84 Polygon or MultiPolygon stored as MultiPolygon.
          content: { application/json: { schema: { type: object, required: [riskArea], properties: { riskArea: { $ref: '#/components/schemas/RiskArea' } } } } }
        default: { $ref: '#/components/responses/DomainError' }
  /api/v1/roads:
    get:
      tags: [Roads]
      summary: List roads and their most recently observed condition
      operationId: listRoads
      parameters: [{ $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Offset' }, { $ref: '#/components/parameters/BBox' }, { $ref: '#/components/parameters/ReportedRoadStatusFilter' }]
      responses:
        '200':
          description: Missing, stale, or expired condition resolves to UNKNOWN, not PASSABLE.
          content: { application/json: { schema: { $ref: '#/components/schemas/RoadList' } } }
        default: { $ref: '#/components/responses/DomainError' }
  /api/v1/road-conditions:
    get:
      tags: [Roads]
      summary: List road condition history
      operationId: listRoadConditions
      parameters: [{ $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Offset' }, { $ref: '#/components/parameters/ReportedRoadStatusFilter' }]
      responses:
        '200':
          description: Descending observation time with preserved reported and effective statuses.
          content: { application/json: { schema: { $ref: '#/components/schemas/ConditionList' } } }
        default: { $ref: '#/components/responses/DomainError' }
    post:
      tags: [Roads]
      summary: Record an ADMIN-reviewed condition for an existing road
      operationId: createRoadCondition
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateRoadCondition' } } }
      responses:
        '201':
          description: Road condition with source type derived from the referenced source.
          content: { application/json: { schema: { type: object, required: [roadCondition], properties: { roadCondition: { $ref: '#/components/schemas/RoadCondition' } } } } }
        default: { $ref: '#/components/responses/DomainError' }
  /api/v1/reports:
    get:
      tags: [Reports]
      summary: List only published verified community reports
      operationId: listPublicReports
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/BBox' }
