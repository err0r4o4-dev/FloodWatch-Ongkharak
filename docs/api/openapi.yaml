          - string
          - 'null'
          format: uuid
        actorEmail:
          type: string
        actorRole:
          type: string
          enum:
          - USER
          - ADMIN
          - SYSTEM
        targetType:
          type: string
        targetId:
          type: string
        metadata:
          type: object
        ipAddress:
          type:
          - string
          - 'null'
        userAgent:
          type:
          - string
          - 'null'
        createdAt:
          type: string
          format: date-time
    SystemSettingInput:
