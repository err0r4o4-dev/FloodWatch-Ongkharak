      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ResourceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIEvidenceVerifyInput'
      description: Disallows self-review, stale report snapshots, and repeated/conflicting
        reviews. roadId is required when a road estimate exists. Approval preserves
        AI provenance and creates canonical observations transactionally; it is not
        an official observation or safety guarantee.
  /api/v1/admin/ai-evidence/{id}/reject:
    post:
      tags:
      - Admin
      operationId: rejectAIEvidence
      summary: Reject AI evidence with a reason (ADMIN only)
      responses:
        '204':
          description: Successful response.
        default:
          $ref: '#/components/responses/DomainError'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ResourceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIEvidenceRejectInput'
      description: Records a private reviewed result and audit trail. Does not delete
        the original community report or publish rejected evidence.
components:
  responses:
    DomainError:
      description: Invalid input (400), missing JWT (401), insufficient role (403), unknown resource (404), conflict (409), oversized upload (413), unsupported media type (415), rate limit (429), or service failure/capacity (500/503). The HTTP status disambiguates.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  parameters:
    ResourceID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      description: Default 20; maximum 100.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Offset:
      name: offset
      in: query
      description: Default 0; maximum 100000.
      schema: { type: integer, minimum: 0, maximum: 100000, default: 0 }
    BBox:
      name: bbox
      in: query
      description: WGS84 minLng,minLat,maxLng,maxLat. Required for efficient map-window queries at scale; omitted bbox still uses bounded pagination.
      schema: { type: string, example: '101.0,14.0,101.1,14.1' }
    From:
      name: from
      in: query
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      schema: { type: string, format: date-time }
    EventStatusFilter:
      name: status
      in: query
      description: Filter by raw event status, not derived effectiveStatus.
      schema: { $ref: '#/components/schemas/EventStatus' }
    SeverityFilter:
      name: severity
      in: query
      description: Filter by raw severity.
      schema: { $ref: '#/components/schemas/Severity' }
    ReportedRoadStatusFilter:
      name: status
      in: query
      description: Filter by reportedStatus, not freshness-derived status. UNKNOWN also includes roads with no condition on the roads route.
      schema: { $ref: '#/components/schemas/RoadStatus' }
    RefreshTokenCookie:
      name: fw_refresh
      in: cookie
      required: true
      description: HttpOnly refresh-token cookie. It uses the configured SameSite Lax or Strict policy and Secure is enabled in production.
      schema:
        type: string
    OptionalRefreshTokenCookie:
      name: fw_refresh
      in: cookie
      required: false
      description: Optional HttpOnly refresh-token cookie. Logout clears it whether or not it identifies an active session.
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    RefreshTokenCookie:
      description: Refresh-token cookie with HttpOnly, configured SameSite Lax or Strict, and Secure in production. The refresh token is never included in the response body.
      schema:
        type: string
    ClearedRefreshTokenCookie:
      description: Expired refresh-token cookie with HttpOnly, configured SameSite Lax or Strict, and Secure in production.
      schema:
        type: string
  schemas:
    PublicNotificationPage:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PublicNotification' } }
        pagination:
          type: object
          additionalProperties: false
          required: [total, limit, offset]
          properties:
            total: { type: integer, minimum: 0 }
            limit: { type: integer, minimum: 1, maximum: 50 }
            offset: { type: integer, minimum: 0, maximum: 100000 }
    PublicNotification:
      type: object
      additionalProperties: false
      required: [id, severity, sourceType, createdAt, title, message, url, location]
      properties:
        id: { type: string, description: Namespaced public notification identifier. }
        severity: { type: string, enum: [INFO, WATCH, WARNING, CRITICAL] }
        sourceType: { type: string, enum: [OFFICIAL, COMMUNITY, AI] }
        createdAt: { type: string, format: date-time, description: Publication time for community reports. }
        title: { type: string }
        message: { type: string }
        url: { type: string, description: Internal report or announcement destination. }
        location:
          oneOf:
            - { $ref: '#/components/schemas/PointGeometry' }
            - { type: 'null' }
    AIEvidenceRejectInput:
      type: object
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
      additionalProperties: false
    AIEvidenceVerifyInput:
      type: object
      required: []
      properties:
        roadId:
          type: string
          format: uuid
      additionalProperties: false
    AIEvidenceResponse:
      type: object
      required:
      - evidence
      properties:
        evidence:
          $ref: '#/components/schemas/AIEvidence'
    AIEvidenceList:
      type: object
      required:
      - items
      - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AIEvidence'
        pagination:
          $ref: '#/components/schemas/Pagination'
    AIEvidence:
      type: object
      required:
      - id
      - reportId
      - mediaId
      - sourceType
      - modelVersion
      - flood
      - road
      - observedAt
      - receivedAt
      - limitations
      - status
      - reportUpdatedAt
      properties:
        id:
          type: string
          format: uuid
        reportId:
          type: string
          format: uuid
        mediaId:
          type: string
          format: uuid
        sourceType:
          type: string
          const: AI
        modelVersion:
          type: string
          minLength: 1
          maxLength: 100
        flood:
          oneOf:
          - $ref: '#/components/schemas/AIFloodEstimate'
          - type: 'null'
        road:
          oneOf:
          - $ref: '#/components/schemas/AIRoadEstimate'
          - type: 'null'
        observedAt:
          type: string
          format: date-time
        receivedAt:
          type: string
          format: date-time
        limitations:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
        status:
          type: string
          enum:
          - UNVERIFIED
          - VERIFIED
          - REJECTED
        reportUpdatedAt:
          type: string
          format: date-time
        reviewedAt:
          type: string
          format: date-time
        reviewedBy:
          type: string
          format: uuid
    AIRoadEstimate:
      type: object
      required:
      - status
      - confidence
      - bounding_box
      properties:
        status:
          $ref: '#/components/schemas/RoadStatus'
        confidence:
          type: number
          minimum: 0
          maximum: 1
        bounding_box:
          type:
          - array
          - 'null'
          minItems: 4
          maxItems: 4
          items:
            type: number
            minimum: 0
            maximum: 1
          description: Normalized ymin,xmin,ymax,xmax when available.
    AIFloodEstimate:
      type: object
      required:
      - severity
      - water_depth_m
      - confidence
      - bounding_box
      properties:
        severity:
          $ref: '#/components/schemas/Severity'
        water_depth_m:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 50
        confidence:
          type: number
          minimum: 0
          maximum: 1
        bounding_box:
          type:
          - array
          - 'null'
          minItems: 4
          maxItems: 4
          items:
            type: number
            minimum: 0
            maximum: 1
          description: Normalized ymin,xmin,ymax,xmax when available.
    PushSubscriptionInput:
      type: object
      required:
      - endpoint
      - keys
      properties:
        locale:
          type: string
          enum: [th, en]
          default: th
          description: Device language for system-generated Push summaries. Original announcements are not automatically translated.
        endpoint:
          type: string
          format: uri
        keys:
          type: object
          required:
          - p256dh
          - auth
          properties:
            p256dh:
              type: string
              minLength: 1
            auth:
              type: string
              minLength: 1
          additionalProperties: false
      additionalProperties: false
    PushLanguageInput:
      type: object
      required:
      - endpoint
      - locale
      properties:
        endpoint:
          type: string
          format: uri
          maxLength: 2048
        locale:
          type: string
          enum: [th, en]
      additionalProperties: false
    PushPublicKey:
      type: object
      required:
      - publicKey
      properties:
        publicKey:
          type: string
    UnreadNotificationCount:
      type: object
      required:
      - count
      properties:
        count:
          type: integer
          minimum: 0
    NotificationList:
      type: object
      required:
      - items
      - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotificationItem'
        pagination:
          $ref: '#/components/schemas/Pagination'
    NotificationItem:
      type: object
      required:
