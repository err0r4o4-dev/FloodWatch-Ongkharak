        setting:
          $ref: '#/components/schemas/SystemSetting'
    SystemSettingsList:
      type: object
      required:
      - settings
      properties:
        settings:
          type: array
          items:
            $ref: '#/components/schemas/SystemSetting'
    SystemSetting:
      type: object
      required:
      - key
      - value
      - valueType
      - description
      - category
      - editable
      - createdAt
      - updatedAt
      - updatedBy
      properties:
        key:
          type: string
        value: {}
        valueType:
          type: string
