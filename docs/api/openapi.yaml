          - string
          - 'null'
          format: date-time
        verifiedReports:
          type: integer
          minimum: 0
        rejectedReports:
          type: integer
          minimum: 0
        auditLogCount:
          type: integer
          minimum: 0
        refreshSessionCount:
          type: integer
          minimum: 0
    ManagedUser:
      type: object
      required:
      - id
      - email
      - role
      - createdAt
      - updatedAt
      - disabledAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - USER
          - ADMIN
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        disabledAt:
          type:
          - string
          - 'null'
          format: date-time
    AdminDashboardStats:
      type: object
      required:
      - totalUsers
      - activeUsers
      - totalReports
      - pendingReports
      - recentActivity
      properties:
        totalUsers:
          type: integer
          minimum: 0
        activeUsers: {type: integer, minimum: 0}
        totalReports: {type: integer, minimum: 0}
        pendingReports: {type: integer, minimum: 0}
        recentActivity: {type: integer, minimum: 0}
    Pagination:
      type: object
      required:
      - total
      - limit
      - offset
      properties:
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset: {type: integer, minimum: 0}
    PublicEventEnvelope:
      type: object
      additionalProperties: false
      required: [eventId, eventType, occurredAt, publishedAt, sourceType, resourceType, resourceId, payloadVersion, payload]
      properties:
        eventId: { type: string, format: uuid }
        eventType: { type: string, enum: [water_level.updated, flood_event.created, flood_event.updated, road.status.changed, report.verified, alert.created] }
        occurredAt: { type: string, format: date-time }
        publishedAt: { type: string, format: date-time }
        sourceType: { $ref: '#/components/schemas/SourceType' }
        resourceType: { type: string, enum: [WATER_STATION, FLOOD_EVENT, ROAD, COMMUNITY_REPORT, ALERT] }
        resourceId: { type: string, format: uuid }
        payloadVersion: { type: integer, enum: [1] }
        payload: { type: object, description: Minimal change hint; refetch the canonical API. }
    Alert:
      type: object
      additionalProperties: false
      required: [id, ruleId, severity, title, message, sourceType, resourceType, resourceId, triggeredAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        ruleId: { type: string, format: uuid }
        severity: { type: string, enum: [INFO, WATCH, WARNING, CRITICAL] }
        title: { type: string }
        message: { type: string }
        sourceType: { $ref: '#/components/schemas/SourceType' }
        resourceType: { type: string, enum: [WATER_STATION, ROAD, FLOOD_EVENT] }
        resourceId: { type: string, format: uuid }
        triggeredAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    AlertList:
      type: object
      additionalProperties: false
      required: [items, limit, offset]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Alert' } }
        limit: { type: integer }
        offset: { type: integer }
    AlertRuleInput:
      type: object
      additionalProperties: false
      required: [name, type, enabled, severity, title, message]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        type: { type: string, enum: [WATER_LEVEL_THRESHOLD, ROAD_CLOSED, FLOOD_CRITICAL] }
        enabled: { type: boolean }
        severity: { type: string, enum: [INFO, WATCH, WARNING, CRITICAL] }
        title: { type: string, minLength: 1, maxLength: 200 }
        message: { type: string, minLength: 1, maxLength: 1000 }
        waterLevelThresholdM: { type: [number, 'null'], minimum: 0, description: Required for WATER_LEVEL_THRESHOLD; absent/null for other rule types. Configured rule, not an official default. }
    AlertRule:
      allOf:
        - { $ref: '#/components/schemas/AlertRuleInput' }
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    AlertRuleResponse:
      type: object
      additionalProperties: false
      required: [rule]
      properties:
        rule: { $ref: '#/components/schemas/AlertRule' }
    ReportStatus:
      type: string
      enum: [PENDING, VERIFIED, REJECTED]
    ReportType:
      type: string
      enum: [FLOOD, ROAD, OTHER]
    ReportInput:
      type: object
      additionalProperties: false
      required: [type, description, location]
      description: Client cannot assign owner, status, reviewer, provenance, or media metadata.
      properties:
        type: { $ref: '#/components/schemas/ReportType' }
        description: { type: string, minLength: 1, maxLength: 2000 }
        location: { $ref: '#/components/schemas/PointGeometry' }
        estimatedWaterDepthM: { type: [number, 'null'], minimum: 0, maximum: 100 }
    GuestReportInput:
      type: object
      additionalProperties: false
      required: [type, description, location]
      properties:
        displayName: { type: string, maxLength: 80, default: Guest, description: Trimmed Unicode display label, not a unique identity or ownership credential. }
        type: { $ref: '#/components/schemas/ReportType' }
        description: { type: string, minLength: 1, maxLength: 2000 }
        location: { $ref: '#/components/schemas/PointGeometry' }
        estimatedWaterDepthM: { type: [number, 'null'], minimum: 0, maximum: 100 }
    GuestReportResponse:
      type: object
      additionalProperties: false
      required: [report, uploadToken]
      properties:
        report: { $ref: '#/components/schemas/Report' }
        uploadToken: { type: string, description: Private short-lived upload capability returned only at creation. }
    ReviewReportInput:
      type: object
      additionalProperties: false
      required: [expectedUpdatedAt]
      properties:
        expectedUpdatedAt: { type: string, format: date-time, description: 'Revision from the latest report detail; a concurrent edit or upload returns 409.' }
    RejectReportInput:
      type: object
      additionalProperties: false
      required: [expectedUpdatedAt]
      properties:
        expectedUpdatedAt: { type: string, format: date-time, description: 'Revision from the latest report detail; a concurrent edit or upload returns 409.' }
        reason: { type: string, minLength: 1, maxLength: 500 }
    ReportMedia:
      type: object
      additionalProperties: false
      required: [id, url]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, description: 'Guarded API path, not a public MinIO object URL.' }
    Report:
      type: object
      additionalProperties: false
      required: [id, type, description, location, estimatedWaterDepthM, status, verificationStatus, sourceType, createdAt, updatedAt, verifiedAt, media]
      description: COMMUNITY evidence; verification permits publication but does not make it OFFICIAL or prove safety. createdAt is submission time rather than a measured observation timestamp.
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid, description: 'Only exposed for legacy owners in owner and ADMIN responses.' }
        displayName: { type: string, maxLength: 80, description: Submitted display-name snapshot; not verified identity. }
        type: { $ref: '#/components/schemas/ReportType' }
        description: { type: string }
        location: { $ref: '#/components/schemas/PointGeometry' }
        estimatedWaterDepthM: { type: [number, 'null'], minimum: 0, maximum: 100 }
        status: { $ref: '#/components/schemas/ReportStatus' }
        verificationStatus: { $ref: '#/components/schemas/ReportStatus' }
        sourceType: { type: string, const: COMMUNITY }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        verifiedAt: { type: [string, 'null'], format: date-time }
        verifiedBy: { type: [string, 'null'], format: uuid, description: 'Owner/ADMIN only; omitted in public responses.' }
        reviewedAt: { type: [string, 'null'], format: date-time, description: 'Owner/ADMIN only; time of verification or rejection.' }
        reviewedBy: { type: [string, 'null'], format: uuid, description: 'Owner/ADMIN only; reviewer of verification or rejection.' }
        rejectionReason: { type: [string, 'null'], maxLength: 500, description: 'Only shown to owner and ADMIN; null in public responses.' }
        media: { type: array, maxItems: 3, items: { $ref: '#/components/schemas/ReportMedia' } }
    ReportList:
      type: object
      additionalProperties: false
      required: [items, limit, offset]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Report' } }
        limit: { type: integer, minimum: 1, maximum: 100 }
        offset: { type: integer, minimum: 0 }
    ReportResponse:
      type: object
      additionalProperties: false
      required: [report]
      properties:
        report: { $ref: '#/components/schemas/Report' }
    ReportMediaResponse:
      type: object
      additionalProperties: false
      required: [media]
      properties:
        media: { $ref: '#/components/schemas/ReportMedia' }
    SourceType:
      type: string
      enum: [OFFICIAL, COMMUNITY, AI]
    VerificationStatus:
      type: string
      enum: [UNVERIFIED, VERIFIED, REJECTED]
    Freshness:
      type: string
      enum: [FRESH, STALE, EXPIRED, UNKNOWN]
      description: Observation age is classified by domain policy. UNKNOWN never means safe.
    Severity:
      type: string
      enum: [INFO, WATCH, WARNING, CRITICAL, UNKNOWN]
    EventStatus:
      type: string
      enum: [ACTIVE, RESOLVED, UNKNOWN]
    RiskLevel:
      type: string
      enum: [LOW, MODERATE, HIGH, VERY_HIGH, UNKNOWN]
    RoadStatus:
      type: string
      enum: [PASSABLE, WATCH, SMALL_VEHICLE_NOT_RECOMMENDED, CLOSED, UNKNOWN]
    Position:
      type: array
      minItems: 2
      maxItems: 2
      description: WGS84 longitude, latitude.
      prefixItems:
        - { type: number, minimum: -180, maximum: 180 }
        - { type: number, minimum: -90, maximum: 90 }
      items: false
    LinearRing:
      type: array
      minItems: 4
      description: Closed sequence of positions.
      items: { $ref: '#/components/schemas/Position' }
    PolygonCoordinates:
      type: array
      minItems: 1
      description: Exterior ring followed by optional interior rings.
      items: { $ref: '#/components/schemas/LinearRing' }
    MultiPolygonCoordinates:
      type: array
      minItems: 1
      items: { $ref: '#/components/schemas/PolygonCoordinates' }
    MultiLineCoordinates:
      type: array
      minItems: 1
      items:
        type: array
        minItems: 2
        items: { $ref: '#/components/schemas/Position' }
    PointGeometry:
      type: object
      additionalProperties: false
      required: [type, coordinates]
      properties:
        type: { type: string, const: Point }
        coordinates: { $ref: '#/components/schemas/Position' }
    FloodGeometry:
      oneOf:
        - { $ref: '#/components/schemas/PointGeometry' }
        - { $ref: '#/components/schemas/SimplePolygonGeometry' }
        - { $ref: '#/components/schemas/MultiPolygonGeometry' }
    PolygonGeometry:
      oneOf:
        - { $ref: '#/components/schemas/SimplePolygonGeometry' }
        - { $ref: '#/components/schemas/MultiPolygonGeometry' }
    SimplePolygonGeometry:
      type: object
      additionalProperties: false
      required: [type, coordinates]
      properties:
        type: { type: string, const: Polygon }
        coordinates: { $ref: '#/components/schemas/PolygonCoordinates' }
    MultiPolygonGeometry:
      type: object
      additionalProperties: false
      required: [type, coordinates]
      properties:
        type: { type: string, const: MultiPolygon }
        coordinates: { $ref: '#/components/schemas/MultiPolygonCoordinates' }
    MultiLineGeometry:
      type: object
      additionalProperties: false
      required: [type, coordinates]
      properties:
        type: { type: string, const: MultiLineString }
        coordinates: { $ref: '#/components/schemas/MultiLineCoordinates' }
    SourceRef:
      type: object
      required: [id, code, name, sourceType]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        sourceType: { $ref: '#/components/schemas/SourceType' }
    DataSource:
      type: object
      required: [id, code, name, sourceType, provider, enabled, lastSuccessfulFetchAt, lastFailureAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        sourceType: { $ref: '#/components/schemas/SourceType' }
        provider: { type: string }
        enabled: { type: boolean }
        lastSuccessfulFetchAt: { type: [string, 'null'], format: date-time }
        lastFailureAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateDataSource:
      type: object
      additionalProperties: false
      required: [code, name, sourceType, provider, enabled]
      properties:
        code: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$' }
        name: { type: string, maxLength: 200 }
        sourceType: { $ref: '#/components/schemas/SourceType' }
        provider: { type: string, maxLength: 200 }
        enabled: { type: boolean }
    WaterStation:
      type: object
      required: [id, source, externalId, code, name, location, district, province, active, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        source: { $ref: '#/components/schemas/SourceRef' }
        externalId: { type: [string, 'null'] }
        code: { type: string }
        name: { type: string }
        location: { $ref: '#/components/schemas/PointGeometry' }
        district: { type: [string, 'null'] }
        province: { type: [string, 'null'] }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WaterReading:
      type: object
      required: [id, stationId, source, observedAt, receivedAt, waterLevelM, flowRateM3s, rainfallMm, verificationStatus, confidence, freshness]
      properties:
        id: { type: string, format: uuid }
        stationId: { type: string, format: uuid }
        source: { $ref: '#/components/schemas/SourceRef' }
        observedAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time }
        waterLevelM: { type: [number, 'null'], description: Canonical water level in meters. }
        flowRateM3s: { type: [number, 'null'] }
        rainfallMm: { type: [number, 'null'] }
        verificationStatus: { $ref: '#/components/schemas/VerificationStatus' }
        confidence: { type: [number, 'null'], minimum: 0, maximum: 1 }
        freshness: { $ref: '#/components/schemas/Freshness' }
    FloodEvent:
      type: object
      required: [id, source, title, description, geometry, severity, effectiveSeverity, status, effectiveStatus, observedAt, receivedAt, startsAt, endedAt, verificationStatus, confidence, freshness, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        source: { $ref: '#/components/schemas/SourceRef' }
        title: { type: string }
        description: { type: string }
        geometry: { $ref: '#/components/schemas/FloodGeometry' }
        severity: { $ref: '#/components/schemas/Severity' }
        effectiveSeverity: { $ref: '#/components/schemas/Severity' }
        status: { $ref: '#/components/schemas/EventStatus' }
        effectiveStatus: { $ref: '#/components/schemas/EventStatus' }
        observedAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time }
        startsAt: { type: [string, 'null'], format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        verificationStatus: { $ref: '#/components/schemas/VerificationStatus' }
        confidence: { type: [number, 'null'], minimum: 0, maximum: 1 }
        freshness: { $ref: '#/components/schemas/Freshness' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RiskArea:
      type: object
      required: [id, source, name, description, geometry, riskLevel, effectiveRiskLevel, freshness, validFrom, validTo, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        source: { $ref: '#/components/schemas/SourceRef' }
        name: { type: string }
        description: { type: string }
        geometry: { $ref: '#/components/schemas/MultiPolygonGeometry' }
        riskLevel: { $ref: '#/components/schemas/RiskLevel' }
        effectiveRiskLevel: { $ref: '#/components/schemas/RiskLevel' }
        freshness: { $ref: '#/components/schemas/Freshness' }
        validFrom: { type: [string, 'null'], format: date-time }
        validTo: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateRiskArea:
      type: object
      additionalProperties: false
      required: [sourceId, name, geometry, riskLevel]
      properties:
        sourceId: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 4000 }
        geometry: { $ref: '#/components/schemas/PolygonGeometry' }
        riskLevel: { $ref: '#/components/schemas/RiskLevel' }
        validFrom: { type: [string, 'null'], format: date-time }
        validTo: { type: [string, 'null'], format: date-time }
    RoadCondition:
      type: object
      required: [source, status, observedAt, receivedAt, validUntil, waterDepthM, confidence, freshness]
      properties:
        id: { type: string, format: uuid }
        roadId: { type: string, format: uuid }
        source: { oneOf: [{ $ref: '#/components/schemas/SourceRef' }, { type: 'null' }] }
        status: { $ref: '#/components/schemas/RoadStatus' }
        reportedStatus: { $ref: '#/components/schemas/RoadStatus' }
        description: { type: string }
        observedAt: { type: [string, 'null'], format: date-time }
        receivedAt: { type: [string, 'null'], format: date-time }
        validUntil: { type: [string, 'null'], format: date-time }
        waterDepthM: { type: [number, 'null'], minimum: 0 }
        verificationStatus: { $ref: '#/components/schemas/VerificationStatus' }
        confidence: { type: [number, 'null'], minimum: 0, maximum: 1 }
        freshness: { $ref: '#/components/schemas/Freshness' }
        createdAt: { type: string, format: date-time }
    CreateRoadCondition:
      type: object
      additionalProperties: false
      required: [roadId, sourceId, status, observedAt, verificationStatus]
      properties:
        roadId: { type: string, format: uuid }
        sourceId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/RoadStatus' }
        description: { type: string, maxLength: 4000 }
        observedAt: { type: string, format: date-time }
        validUntil: { type: [string, 'null'], format: date-time }
        waterDepthM: { type: [number, 'null'], minimum: 0 }
        verificationStatus: { $ref: '#/components/schemas/VerificationStatus' }
        confidence: { type: [number, 'null'], minimum: 0, maximum: 1 }
    Road:
      type: object
      required: [id, code, name, geometry, roadClass, currentCondition, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        geometry: { $ref: '#/components/schemas/MultiLineGeometry' }
        roadClass: { type: [string, 'null'] }
        currentCondition: { $ref: '#/components/schemas/RoadCondition' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DataSourceList:
      type: object
      required: [items, limit, offset]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/DataSource' } }
        limit: { type: integer }
        offset: { type: integer }
    StationList:
      type: object
      required: [items, limit, offset]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/WaterStation' } }
        limit: { type: integer }
        offset: { type: integer }
    ReadingList:
      type: object
      required: [items, limit, offset]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/WaterReading' } }
        limit: { type: integer }
        offset: { type: integer }
    EventList:
      type: object
      required: [items, limit, offset]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/FloodEvent' } }
        limit: { type: integer }
        offset: { type: integer }
    RiskList:
      type: object
      required: [items, limit, offset]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/RiskArea' } }
        limit: { type: integer }
        offset: { type: integer }
    RoadList:
      type: object
      required: [items, limit, offset]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Road' } }
        limit: { type: integer }
        offset: { type: integer }
    ConditionList:
      type: object
      required: [items, limit, offset]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/RoadCondition' } }
        limit: { type: integer }
        offset: { type: integer }
    CredentialsRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          maxLength: 254
          description: Email or case-insensitive username. The field name remains email for compatibility.
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          description: Server bounds this value to 12–128 UTF-8 bytes.
    RegistrationRequest:
      type: object
      additionalProperties: false
      required: [email, username, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[A-Za-z0-9_]{3,32}$'
          description: Trimmed and normalized to lowercase; globally unique. Legacy and Google-only accounts may have no username.
        password:
          type: string
          format: password
          description: Server bounds this value to 12–128 UTF-8 bytes.
    RequestPasswordOTP:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    PasswordOTPChallenge:
      type: object
      additionalProperties: false
      required: [challengeId, expiresIn, resendAfter, message]
      properties:
        challengeId:
          type: string
          format: uuid
        expiresIn:
          type: integer
          const: 600
        resendAfter:
          type: integer
          const: 60
        message:
          type: string
          description: Account-neutral recovery notice, not an assertion that the account exists.
    VerifyPasswordOTP:
      type: object
      additionalProperties: false
      required: [challengeId, otp]
      properties:
        challengeId:
          type: string
          format: uuid
        otp:
          type: string
          pattern: '^[0-9]{6}$'
    PasswordResetGrant:
      type: object
      additionalProperties: false
      required: [resetToken, expiresIn]
      properties:
        resetToken:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Secret single-use reset-only authorization; never a bearer login token.
        expiresIn:
          type: integer
          const: 300
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [resetToken, password]
      properties:
        resetToken:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
        password:
          type: string
          format: password
          description: Server bounds this value to 12–128 UTF-8 bytes. Confirmation is checked by the UI and not sent to the API.
    User:
      type: object
      additionalProperties: false
      required: [id, email, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        username:
          type: string
          pattern: '^[a-z0-9_]{3,32}$'
          description: Omitted for legacy or Google-only accounts without a username.
        role:
          type: string
          enum: [USER, ADMIN]
        createdAt:
          type: string
          format: date-time
    UserResponse:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'
    SessionResponse:
      type: object
      additionalProperties: false
      required: [user, accessToken, expiresIn]
      properties:
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
          description: Short-lived bearer access token.
        expiresIn:
          type: integer
          minimum: 1
          description: Seconds until the access token expires.
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    HealthResponse:
      type: object
      required: [status, time]
      properties:
        status:
          type: string
          const: ok
        time:
          type: string
          format: date-time
    DependencyStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
    ReadinessResponse:
      type: object
      required: [status, dependencies]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        dependencies:
          type: object
          required: [postgres, redis, minio]
          properties:
            postgres:
              $ref: '#/components/schemas/DependencyStatus'
            redis:
              $ref: '#/components/schemas/DependencyStatus'
            minio:
              $ref: '#/components/schemas/DependencyStatus'
